# MENÚ - Aquí es donde arreglamos los enlaces
# # # # # # # # # # # # # # # # # # # # # # # # # # # # #

[menu]
  [[menu.main]]
    identifier  = "about"
    name        = "Sobre mí"
    url         = "https://chumito.github.io/about/"     # Dirección completa
    hasChildren = true
  
  [[menu.main]]
    identifier  = "me"
    name        = "About Me"
    url         = "https://chumito.github.io/about/me/"  # Dirección completa
    parent      = "about"

  [[menu.main]]
    identifier = "posts"
    name       = "Posts"
    url        = "https://chumito.github.io/posts/"      # Dirección completa
