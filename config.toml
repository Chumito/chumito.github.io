baseURL = "https://chumito.github.io/"
title   = "Hello Friend NG"
languageCode = "es" # Lo cambié a español para ti
#theme = "hello-friend-ng"

PygmentsCodeFences = true
PygmentsStyle = "monokai"

copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License."

archetypeDir = "archetypes"
contentDir   = "content"
dataDir      = "data"
layoutDir    = "layouts"
publishDir   = "public"

buildDrafts  = false
buildFuture  = false
buildExpired = false
canonifyURLs = true

enableRobotsTXT = true
enableGitInfo   = false
enableEmoji     = true
enableMissingTranslationPlaceholders = false
disableRSS     = false
disableSitemap = false
disable404     = false
disableHugoGeneratorInject = false

[pagination]
  disableAliases = false
  pagerSize = 20
  path = 'page'

[services]
  [services.rss]
      limit = 42

[permalinks]
  posts = "/posts/:year/:month/:title/"

[blackfriday]
  hrefTargetBlank = true

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  description = "Nice theme for homepages and blogs"
  keywords = ""
  images = [""]

  # OJO AQUÍ: Este es el subtítulo que aparece en la página principal
  homeSubtitle = "Bienvenida a mi web"

  disableReadOtherPosts = false
  enableThemeToggle = false
  enableSharingButtons = true
  enableReadingTime = true
  enableGlobalLanguageMenu = false


  customCSS = []
  customJS  = []

  [params.author]
    # OJO AQUÍ: Cambia esto por tu nombre real
    name = "Chumito" 

  [params.footer]
    trademark = 2026
    rss = true
    copyright = true
    author = true

    topText = []
    bottomText = [
      "Powered by <a href=\"http://gohugo.io\">Hugo</a>",
      "Theme: Hello Friend NG"
    ]

  [params.favicon.color]
    mask = "#1b1c1d"
    msapplication = "#1b1c1d"
    theme = "#1b1c1d"

  [params.logo]
    logoMark     = ">"
    logoText     = "$ cd /home/"
    logoHomeLink = "/"

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #  
  # REDES SOCIALES
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  # Puedes cambiar las url por las tuyas o borrar las que no uses
  
  [[params.social]]
    name = "github"
    url  = "https://github.com/"

  [[params.social]]
    name = "email"
    url  = "mailto:tu-email@example.com"


# # # # # # # # # # # # # # # # # # # # # # # # # # # # #  
# IDIOMAS
# # # # # # # # # # # # # # # # # # # # # # # # # # # # #

[languages]
  # 1. Configuración ACTIVA: ESPAÑOL
  # Al cambiar [languages.en] por [languages.es], le decimos que este es el idioma base.
  [languages.es]
    weight    = 1
    languageName = "Español"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
  
  [languages.es.params]
    subtitle  = "Bienvenida a mi web"

  # 2. Configuración FUTURA: INGLÉS (Apagada por ahora)
  # Cuando quieras agregar inglés, solo borra los símbolos '#' de abajo.
  
  # [languages.en]
  #   weight    = 2
  #   languageName = "English"
  #   copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
  # [languages.en.params]
  #   subtitle  = "Welcome to my website"

